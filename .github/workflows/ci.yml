name: Tests

# quick: every pull request and push to main (lint + the suite on one Python).
# full: every supported Python on Linux, Windows and macOS; runs on pushes to main,
# when a maintainer adds the `full-tests` label to a pull request, or when started by hand.
# coverage and stubs: pushes to main and manual runs.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}-${{ github.event.action == 'labeled' && github.event.label.name || 'code' }}
  cancel-in-progress: true

jobs:
  quick:
    if: github.event.action != 'labeled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]" ruff
      - name: Lint
        run: ruff check lcms2 scripts tests examples
      - name: Notebooks match their scripts
        run: python scripts/dev.py notebooks check
      - name: Tests
        run: pytest -q

  full:
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'full-tests'))
    name: full (${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.14t", "3.15", "3.15t"]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]" ruff
      - name: Lint
        run: ruff check lcms2 scripts tests examples
      - name: Tests
        run: pytest -q

  coverage:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]" pytest-cov
      - name: Tests with coverage
        run: pytest -q --cov=lcms2 --cov-report=term-missing

  stubs:
    # Stubs are generated at release time; lcms2/_lcms2.pyi is hand-written and its docstrings must match.
    if: github.event.action != 'labeled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . "stubpy>=0.8.2"
      - name: Generate stubs
        run: python -m stubpy generate lcms2
      - name: Check extension stub docstrings
        run: python -m stubpy docstrings check lcms2/_lcms2.pyi
