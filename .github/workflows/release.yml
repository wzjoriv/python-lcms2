name: Build and publish

on:
  release:
    types: [published]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest        # Linux x86_64
          - ubuntu-24.04-arm     # Linux ARM64
          - windows-latest       # Windows x86_64
          - windows-11-arm       # Windows ARM64
          - macos-15-intel       # macOS Intel x86_64
          - macos-latest         # macOS Apple Silicon ARM64

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel==3.4.1

      - name: Generate type stubs
        run: |
          python -m pip install "stubpy>=0.11.3"
          python -m stubpy generate lcms2

      - name: Build wheels
        run: python -m cibuildwheel --output-dir wheelhouse

      - name: Check every module ships a stub
        shell: python
        run: |
          import pathlib, sys, zipfile
          bad = []
          for whl in pathlib.Path("wheelhouse").glob("*.whl"):
              names = set(zipfile.ZipFile(whl).namelist())
              bad += [f"{whl.name}: {n}" for n in names if n.endswith(".py") and n[:-3] + ".pyi" not in names]
          print("\n".join(bad) or "every module has a stub")
          sys.exit(1 if bad else 0)

      - uses: actions/upload-artifact@v7
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl

  build_pyodide:
    name: Build Pyodide wheels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel==3.4.1

      - name: Generate type stubs
        run: |
          python -m pip install "stubpy>=0.11.3"
          python -m stubpy generate lcms2

      - name: Build Pyodide wheels
        run: python -m cibuildwheel --platform pyodide --output-dir wheelhouse
        env:
          CIBW_BUILD: "cp312-* cp313-*"

      - uses: actions/upload-artifact@v7
        with:
          name: pyodide-wheels
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Generate type stubs
        run: |
          python -m pip install "stubpy>=0.11.3"
          python -m stubpy generate lcms2

      - name: Build sdist
        run: pipx run build --sdist

      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  collect:
    name: Collect all distributions
    needs: [build_wheels, build_pyodide, build_sdist]
    runs-on: ubuntu-latest
    # every platform wheel must build; Pyodide wheels are optional
    if: ${{ always() && needs.build_sdist.result == 'success' && needs.build_wheels.result == 'success' }}

    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: cibw-wheels-*
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@v8
        with:
          name: sdist
          path: dist

      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: pyodide-wheels
          path: dist/pyodide

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: [collect, build_sdist]
    runs-on: ubuntu-latest
    if: ${{ always() && github.event_name == 'release' && needs.build_sdist.result == 'success' && needs.collect.result == 'success' }}
    environment: pypi
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - run: rm -rf dist/pyodide

      - uses: pypa/gh-action-pypi-publish@release/v1