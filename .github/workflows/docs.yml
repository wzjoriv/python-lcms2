name: Docs

# pull request: build only (warnings are errors).
# push to main: publish to gh-pages /dev/.
# release published: publish to gh-pages /stable/ and /v<major.minor>/.
# The gh-pages root redirects to /stable/ (Pages source: the gh-pages branch).
# Every step is skipped until docs/conf.py exists.

on:
  pull_request:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    env:
      LCMS2_DOCS_CHANNEL: ${{ github.event_name == 'release' && 'stable' || 'dev' }}
    outputs:
      series: ${{ steps.series.outputs.series }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false
      - if: hashFiles('docs/conf.py') != ''
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - if: hashFiles('docs/conf.py') != ''
        uses: actions/cache@v5
        with:
          path: docs/_build/doctrees
          key: doctrees-${{ env.LCMS2_DOCS_CHANNEL }}-${{ hashFiles('docs/**', 'lcms2/**') }}
          restore-keys: doctrees-${{ env.LCMS2_DOCS_CHANNEL }}-
      - name: Install
        if: hashFiles('docs/conf.py') != ''
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs]"
      - name: Build HTML
        if: hashFiles('docs/conf.py') != ''
        run: sphinx-build -b html -W --keep-going -d docs/_build/doctrees docs docs/_build/html
      - id: series
        name: Version series
        if: hashFiles('docs/conf.py') != ''
        run: echo "series=v$(python -c 'import lcms2; print(".".join(lcms2.__version__.split(".")[:2]))')" >> "$GITHUB_OUTPUT"
      - if: github.event_name != 'pull_request' && hashFiles('docs/conf.py') != ''
        uses: actions/upload-artifact@v7
        with:
          name: html
          path: docs/_build/html

  publish:
    name: Publish to gh-pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - if: hashFiles('docs/conf.py') != ''
        uses: actions/download-artifact@v8
        with:
          name: html
          path: html
      - name: Assemble site
        if: hashFiles('docs/conf.py') != ''
        env:
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          SERIES: ${{ needs.build.outputs.series }}
        run: |
          mkdir -p site
          if [ "$EVENT" = release ]; then
            cp -r html site/stable
            cp -r html "site/$SERIES"
          else
            cp -r html site/dev
          fi
          target=dev
          if [ "$EVENT" = release ] || curl -fsI "https://raw.githubusercontent.com/$REPO/gh-pages/stable/index.html" >/dev/null; then
            target=stable
          fi
          printf '<!doctype html><meta http-equiv="refresh" content="0; url=%s/"><link rel="canonical" href="%s/">\n' "$target" "$target" > site/index.html
          touch site/.nojekyll
      - if: hashFiles('docs/conf.py') != ''
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: site
          keep_files: true
